name: Deploy to VPS

# Build the Next.js standalone bundle on every push to main and ship it to the
# Hostinger VPS over SSH. The build always runs; the deploy step only runs once
# the VPS_* secrets are set, so the first push builds green while you finish
# configuring access. See docs/CICD.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level so it can gate the deploy step (secrets can't be used in `if`
      # directly, but an env derived from one can).
      VPS_HOST: ${{ secrets.VPS_HOST }}
      # pm2 process name and the port it listens on. Only used when bootstrapping
      # a fresh app — an existing process keeps whatever port it already has.
      APP_NAME: kaaafrika-real-estate
      APP_PORT: "3200"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (standalone)
        env:
          # The API base URL is currently hardcoded in services/Interceptor.ts,
          # so nothing here is required. Set the repo Variable to override it
          # once the code reads this — it is public config, not a secret.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm build

      - name: Assemble the standalone bundle
        # Next's standalone output ships server.js + a trimmed node_modules, but
        # not static assets or public/ — they have to be copied in beside it.
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Deploy to the VPS
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          echo "$VPS_SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          PORT="${VPS_PORT:-22}"
          # $HOME (not ~) — a tilde inside a quoted string is NOT expanded, which
          # would make ssh look for a literal "~/.ssh" path and silently skip the key.
          # ControlMaster multiplexes every later ssh/rsync over ONE TCP connection.
          # Without it this step opens ~7 separate connections in a few seconds,
          # which reads like a brute-force burst to fail2ban and to aaPanel's SSH
          # protection — and a ban shows up here as a bare "Connection timed out".
          SSHOPTS="-i $HOME/.ssh/id_deploy -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPath=/tmp/ssh-deploy-%C -o ControlPersist=120s"

          echo "== preflight: confirm SSH login =="
          # Retry with backoff: a timeout here is usually transient (a rate-limit
          # window expiring), and failing the whole deploy on the first one means
          # re-running by hand for no reason.
          CONNECTED=""
          for attempt in 1 2 3; do
            if ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "echo connected as \$(whoami)"; then
              CONNECTED=yes; break
            fi
            [ "$attempt" = 3 ] && break
            echo "attempt $attempt failed — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          if [ -z "$CONNECTED" ]; then
            echo "Could not open an SSH session to the VPS after 3 attempts."
            echo "The box itself may be fine — check that it is not the SSH path alone:"
            echo "  * fail2ban:  fail2ban-client status sshd"
            echo "  * firewall:  iptables -L INPUT -n | head -30"
            echo "  * sshd up:   systemctl status sshd; ss -ltnp | grep ':$PORT '"
            echo "Nothing was transferred and the running app is untouched."
            exit 1
          fi

          echo "== rsync bundle =="
          ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_PATH'"
          # --force: pnpm's node_modules layout means the bundle carries
          # node_modules/{next,react,react-dom} as relative symlinks into
          # .pnpm/. Where the deploy dir still holds an older npm-style install,
          # those same paths are real non-empty directories, and rsync refuses to
          # replace a directory with a symlink unless forced ("could not make way
          # for new symlink", exit 23). This deletes only the directories standing
          # in the way of a transfer — it is not --delete, so files the panel put
          # there are left alone.
          rsync -az --force -e "ssh $SSHOPTS" .next/standalone/ "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/"

          echo "== resolve pm2 on the VPS =="
          # pm2 is not on root's PATH under aaPanel: it sits beside whichever Node
          # the panel installed, and that path MOVES when the panel changes Node
          # version. So probe every plausible location once, here, and reuse the
          # absolute path — rather than re-globbing inside each ssh call and
          # failing with a bare "command not found" when the glob misses.
          # Probe by RUNNING each candidate, not just testing -x — and run it with
          # its own directory prepended to PATH. pm2's launcher starts with
          # `#!/usr/bin/env node`, and aaPanel keeps node in that same bin dir,
          # which is NOT on root's PATH in a non-interactive ssh session. Without
          # the prefix the launcher dies with "env: node: No such file or
          # directory" and exit 127 — identical to pm2 not being installed at all.
          # The trailing `true` matters: with no match the loop's last test is
          # false, so the remote script would exit 1 — and under `set -e` that
          # aborts this step AT the assignment, before the diagnostic below can
          # run. `|| PM2=""` covers the same hazard on the local side.
          PM2=$(ssh $SSHOPTS "$VPS_USER@$VPS_HOST" 'for c in /www/server/nodejs/*/bin/pm2 /usr/local/bin/pm2 /usr/bin/pm2 /usr/lib/node_modules/pm2/bin/pm2 $(command -v pm2 2>/dev/null); do d=$(dirname "$c"); [ -x "$c" ] && PATH="$d:$PATH" "$c" -v >/dev/null 2>&1 && { echo "$c"; exit 0; }; done; true') || PM2=""
          if [ -z "$PM2" ]; then
            echo "pm2 not found on the VPS."
            echo "Searched: /www/server/nodejs/*/bin/pm2, /usr/local/bin/pm2, /usr/bin/pm2,"
            echo "          /usr/lib/node_modules/pm2/bin/pm2, and \$PATH."
            echo "-- what is actually under /www/server/nodejs --"
            ssh $SSHOPTS "$VPS_USER@$VPS_HOST" 'ls -d /www/server/nodejs/*/ 2>/dev/null; echo "--- bins ---"; ls /www/server/nodejs/*/bin/ 2>/dev/null | sort -u | head -40' || true
            echo "The app itself is untouched and still running; only the restart was skipped."
            exit 1
          fi
          echo "pm2: $PM2"
          # Every later pm2 call needs node reachable for the same shebang reason,
          # so carry the bin dir along on PATH.
          PM2_DIR=$(dirname "$PM2")
          PM2_ENV="PATH=$PM2_DIR:\$PATH"

          echo "== locate the pm2 app running from the deploy dir =="
          # Act ONLY on the app whose working dir IS the deploy dir — safe on a
          # box that runs other pm2 apps too (KaaOps lives on this same VPS).
          # stderr is deliberately NOT discarded here: swallowing it is what turned
          # a missing pm2 into an unexplained exit 127.
          JLIST=$(ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "$PM2_ENV '$PM2' jlist")
          echo "-- pm2 apps (name / dir / script) --"
          printf '%s' "$JLIST" | jq -r '.[]|"  - \(.name) [id \(.pm_id)] cwd=\(.pm2_env.pm_cwd // .pm2_env.cwd // "?") exec=\(.pm2_env.pm_exec_path // "?")"'
          TARGET="${VPS_APP_PATH%/}"
          MATCH=$(printf '%s' "$JLIST" | jq -c --arg t "$TARGET" '[.[]|select(((.pm2_env.pm_cwd // .pm2_env.cwd // "")|sub("/+$";""))==$t)][0] // empty')
          ID=$(printf '%s' "$MATCH" | jq -r '.pm_id // empty')
          EXEC=$(printf '%s' "$MATCH" | jq -r '.pm2_env.pm_exec_path // ""')
          NAME=$(printf '%s' "$MATCH" | jq -r '.name // empty')
          NAME="${NAME:-$APP_NAME}"

          if [ -n "$ID" ] && [ "$(basename "$EXEC")" = "server.js" ]; then
            echo "restarting pm2 id $ID — its cwd matches the deploy dir and it runs server.js"
            ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "$PM2_ENV '$PM2' restart $ID --update-env"
            # An existing process keeps the port it was started with, which is
            # not necessarily APP_PORT — health-check the one it actually uses.
            CHECK_PORT=$(printf '%s' "$MATCH" | jq -r '.pm2_env.PORT // .pm2_env.env.PORT // empty')
          else
            if [ -n "$ID" ]; then
              # e.g. an aaPanel-created app running `next start`. That command
              # cannot serve a standalone bundle, so re-point it at server.js.
              # Keep whatever port it already had — nginx proxies to that port,
              # and moving it would take the site down without touching nginx.
              echo "pm2 id $ID is in the deploy dir but runs '$EXEC', not server.js — re-creating '$NAME'"
              CHECK_PORT=$(printf '%s' "$MATCH" | jq -r '.pm2_env.PORT // .pm2_env.env.PORT // empty')
              ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "$PM2_ENV '$PM2' delete $ID >/dev/null 2>&1 || true"
            fi
            CHECK_PORT="${CHECK_PORT:-$APP_PORT}"
            echo "starting '$NAME' from the deploy dir on port $CHECK_PORT"
            ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "
              set -e
              export $PM2_ENV
              cd '$VPS_APP_PATH'
              if [ ! -f server.js ]; then echo 'server.js not in deploy dir — is VPS_APP_PATH correct?'; ls -la | head; exit 1; fi
              '$PM2' delete '$NAME' >/dev/null 2>&1 || true
              PORT=$CHECK_PORT HOSTNAME=0.0.0.0 '$PM2' start server.js --name '$NAME' --update-env
              '$PM2' save
            "
          fi

          if [ -z "${CHECK_PORT:-}" ]; then
            echo "== health check skipped: pm2 reports no PORT for this app =="
            exit 0
          fi

          echo "== health check on port $CHECK_PORT =="
          # Hit the app directly on the box, so this tests the deploy rather than
          # DNS or the reverse proxy in front of it.
          ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "
            for i in \$(seq 1 10); do
              CODE=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$CHECK_PORT/ || true)
              if [ \"\$CODE\" = '200' ]; then echo \"up — HTTP \$CODE on port $CHECK_PORT\"; exit 0; fi
              sleep 3
            done
            echo 'app did not return 200 on port $CHECK_PORT — check pm2 logs'
            export $PM2_ENV; '$PM2' logs '$NAME' --lines 40 --nostream 2>/dev/null || '$PM2' logs --lines 40 --nostream || true
            exit 1
          "

      - name: Deploy skipped
        if: env.VPS_HOST == ''
        run: echo "VPS secrets not set yet — built only. Add them (docs/CICD.md) to enable deploy."
